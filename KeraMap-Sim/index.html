<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--axis:#c3c2b7;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--axis:#383835;--accent:#3987e5}}

html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px 0;background:var(--surface);border-bottom:1px solid var(--axis)}

button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

<script>
'use strict';
const PAGES = {"simulator": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Keratoconus Repair Simulator<\/title>\n<style>\n:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);\n--uni:#2a78d6;--cone:#eb6834;--opt:#1baf7a;--warn:#fab219;--mid:#f0efec}\n@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);\n--uni:#3987e5;--cone:#d95926;--opt:#199e70;--mid:#383835}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:16px 20px 0}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 2px}\np.sub{margin:2px 0 10px;color:var(--ink2);font-size:12.5px}\n.warn{border-left:4px solid var(--warn);background:var(--surface);padding:8px 12px;margin:10px 0 0;font-size:13px}\nmain{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px 20px 30px}\n@media (max-width:860px){main{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:14px;margin-bottom:16px;min-width:0}\ndetails{border-top:1px solid var(--grid);padding:6px 0}summary{cursor:pointer;font-weight:600}\nlabel{display:block;margin:8px 0 0;font-size:12.5px;color:var(--ink2)}\nlabel output{float:right;color:var(--ink);font-variant-numeric:tabular-nums}\ninput[type=range]{width:100%}select,button{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:6px;padding:6px 8px}\nselect{width:100%}button{cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.5;cursor:default}\n#status{font-size:12px;color:var(--ink2);min-height:18px;margin-top:6px}\ntable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}\nth,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;font-size:13px}th:first-child,td:first-child{text-align:left;white-space:nowrap}th{color:var(--ink2);font-weight:600}\n.key{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}\n.scroll{overflow-x:auto}\n.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\nfigure{margin:0;text-align:center}figcaption{font-size:12.5px;margin-bottom:4px}\ncanvas{width:100%;max-width:240px;height:auto}\n.scale{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--ink2);margin-top:8px}\n.bar{width:180px;height:10px;border-radius:3px}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.two>.card{margin:0}.two{margin-bottom:16px}\nsvg{width:100%;height:auto;display:block}svg text{fill:var(--muted);font-size:11px}\n.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:4px}\n.row{display:flex;flex-wrap:wrap;gap:0 6px;align-items:center;margin-bottom:8px}.row button{margin:4px 0 0}\nbutton[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}\nlabel.inline{margin:4px 0 0 8px;display:inline-flex;gap:5px;align-items:center}\n.eyebox{position:relative;border-radius:8px;overflow:hidden;background:#0e0f12}\ncanvas#eye{display:block;width:100%;max-width:none;height:min(62vh,500px);min-height:300px;touch-action:none;cursor:grab}\n#eyeLabel{position:absolute;left:10px;top:8px;color:#f0efec;font-size:12.5px;pointer-events:none;white-space:pre-line;text-shadow:0 1px 3px #000}\n#tip{position:fixed;display:none;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5;white-space:nowrap}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Image-guided corneal repair: scenario simulator<\/h1>\n  <div class=\"warn\"><strong>Illustrative simulation.<\/strong> Shapes, material values and protein response are assumed. It uses a simplified shell model and thin-element optics, with no patient or laboratory data. It does not show that any protein or treatment works.<\/div>\n<\/header>\n<main>\n  <aside>\n    <div class=\"card\" id=\"controls\">\n      <label>Repair assumption\n        <select id=\"mode\">\n          <option value=\"budget\">A: matched stiffness budget<\/option>\n          <option value=\"delivery\">B: matched protein dose (transport)<\/option>\n        <\/select>\n      <\/label>\n      <div id=\"sliders\"><\/div>\n      <label>Spectacle correction removed\n        <select id=\"correction\">\n          <option value=\"spherocyl\">Sphere and cylinder<\/option>\n          <option value=\"sphere\">Sphere only<\/option>\n          <option value=\"none\">None (tilt only)<\/option>\n        <\/select>\n      <\/label>\n      <button id=\"reset\">Default cone<\/button><button id=\"mild\">Mild cone<\/button>\n      <div id=\"status\" role=\"status\"><\/div>\n    <\/div>\n  <\/aside>\n  <section>\n    <div class=\"card\" id=\"eyeCard\">\n      <h2>3D human eye<\/h2>\n      <p class=\"sub\">Rendered anatomical model, not a photograph or patient scan. Drag to rotate. Only the corneal shape comes from the simulation.<\/p>\n      <div class=\"row\" id=\"eyeScen\" role=\"group\" aria-label=\"Scenario shown on the eye\"><\/div>\n      <div class=\"eyebox\"><canvas id=\"eye\" role=\"img\" aria-label=\"Three-dimensional human eye\"><\/canvas><div id=\"eyeLabel\"><\/div><\/div>\n      <div class=\"row\" role=\"group\" aria-label=\"View\">\n        <button data-view=\"front\">Front<\/button><button data-view=\"angle\">Angled<\/button><button data-view=\"side\">Side profile<\/button><button data-view=\"section\">Cut section<\/button>\n        <label class=\"inline\"><input type=\"checkbox\" id=\"eyeHeat\"> Shape-change colours<\/label>\n        <label class=\"inline\"><input type=\"checkbox\" id=\"eyeRings\"> Reflected rings<\/label>\n      <\/div>\n      <label for=\"eyeMag\">Magnification of the difference from healthy<output id=\"eyeMagOut\"><\/output><\/label>\n      <input type=\"range\" id=\"eyeMag\" min=\"1\" max=\"10\" step=\"1\" value=\"4\">\n      <p class=\"sub\" id=\"eyeNote\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Scenario comparison<\/h2>\n      <p class=\"sub\" id=\"optNote\"><\/p>\n      <div class=\"scroll\"><table id=\"results\"><\/table><\/div>\n      <button id=\"uncert\">Run uncertainty (60 samples)<\/button><button id=\"csv\">Download results (CSV)<\/button>\n      <div class=\"scroll\"><table id=\"uncertTable\"><\/table><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Front surface minus healthy reference (µm)<\/h2>\n      <p class=\"sub\">Central 8 mm. Red sits further out than healthy, blue further in. Dashed circle: cone half-maximum.<\/p>\n      <div class=\"maps\" id=\"heightMaps\"><\/div><div class=\"scale\" id=\"heightScale\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Added stiffness factor<\/h2>\n      <p class=\"sub\">Hypothetical change added to the weakened stiffness factor (healthy = 1). Cross: footprint centre.<\/p>\n      <div class=\"maps\" id=\"stiffMaps\"><\/div><div class=\"scale\" id=\"stiffScale\"><\/div>\n    <\/div>\n    <div class=\"two\">\n      <div class=\"card\"><h2>Contrast transfer (MTF)<\/h2><p class=\"sub\">Higher is better. Geometric rays multiplied by the diffraction limit.<\/p><div id=\"mtfChart\"><\/div><\/div>\n      <div class=\"card\"><h2>Section through the cone centre<\/h2><p class=\"sub\">Front-surface height minus healthy (µm) along x.<\/p><div id=\"secChart\"><\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Predicted blur of a test letter<\/h2>\n      <p class=\"sub\" id=\"blurNote\"><\/p>\n      <div class=\"maps\" id=\"blur\"><\/div>\n    <\/div>\n    <div class=\"two\">\n      <div class=\"card\"><h2>Protein in the stroma over time<\/h2><p class=\"sub\">Depth average, free plus bound, relative to the starting reservoir. Used only in mode B.<\/p><div id=\"timeChart\"><\/div><\/div>\n      <div class=\"card\"><h2>Protein by depth at the final time<\/h2><p class=\"sub\">0 µm is the front of the stroma. Epithelium acts as a surface barrier.<\/p><div id=\"depthChart\"><\/div><\/div>\n    <\/div>\n  <\/section>\n<\/main>\n<div id=\"tip\"><\/div>\n<script>\n/* Reduced-order keratoconus repair model. Every value is an illustrative assumption.\n   Units: mm, MPa, hours, unless a name says otherwise. No patient or laboratory data. */\n(function (root) {\n'use strict';\n\nconst R = 7.8, R_OPT = 4.0, R_MECH = 5.75, NU = 0.49;\nconst N_CORNEA = 1.376, N_AQUEOUS = 1.336, LAMBDA_MM = 0.55e-3;\nconst MMHG = 0.000133322, P_IMAGE = 15; // pressure (mmHg) at which shapes are prescribed\nconst ARCMIN_PER_MRAD = 3.43775, DEG_PER_MRAD = 0.0572958;\n\nconst DEFAULTS = {\n  // default cone (illustrative values)\n  coneX: 0.6, coneY: -0.7, coneSigma: 0.85, bulge: 0.20, loss: 0.14, weak: 0.45,\n  // mechanics and optics\n  E0: 0.3, iop: 15, pupil: 4, correction: 'spherocyl',\n  // repair\n  mode: 'budget', budget: 0.1, cap: 1.5, footSigma: 0.85,\n  // transport\n  dose: 1, permLog: -6, diff: 20, kon: 0.3, koff: 0.05, kcl: 0.02,\n  contact: 2, resHalf: 4, observe: 24, placeErr: 0.3,\n  emax: 1.0, u50: 0.2\n};\n\nfunction makeGrid(h) {\n  const half = Math.ceil(R_MECH / h) + 2, n = 2 * half + 1;\n  const x = new Float64Array(n * n), y = new Float64Array(n * n);\n  const active = [], ring = [];\n  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {\n    const k = j * n + i; x[k] = (i - half) * h; y[k] = (j - half) * h;\n    const r = Math.hypot(x[k], y[k]);\n    if (r < R_MECH - 1e-9) active.push(k);\n    if (r < R_MECH + 1.01 * h && i > 0 && j > 0 && i < n - 1 && j < n - 1) ring.push(k);\n  }\n  return { h, n, half, x, y, active: Int32Array.from(active), ring: Int32Array.from(ring) };\n}\n\nconst gauss = (x, y, cx, cy, s) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * s * s));\nconst healthyFront = (x, y) => Math.sqrt(R * R - x * x - y * y) - R;\nconst healthyThick = (x, y) => 0.55 + 0.16 * (x * x + y * y) / 16;\n\n/* Shallow-shell energy: D(lap w)^2 + N|grad w|^2 + k w^2 - 2pw, w = 0 outside R_MECH.\n   Solved by Jacobi-preconditioned conjugate gradients. */\nfunction solveShell(g, S, thick, E0, iop, guess, tol) {\n  const { n, h, active, ring } = g, M = n * n;\n  const p = iop * MMHG, T = p * R / 2, h2 = h * h, h4 = h2 * h2;\n  const D = new Float64Array(M), K = new Float64Array(M), diag = new Float64Array(M);\n  for (const k of ring) {\n    const E = E0 * S[k], t = thick[k];\n    D[k] = E * t * t * t / (12 * (1 - NU * NU));\n    K[k] = 2 * E * t / ((1 - NU) * R * R);\n  }\n  for (const k of active)\n    diag[k] = (16 * D[k] + D[k - 1] + D[k + 1] + D[k - n] + D[k + n]) / h4 + 4 * T / h2 + K[k];\n  const lap = new Float64Array(M);\n  function apply(v, out) {\n    for (const k of ring) lap[k] = D[k] * (v[k - 1] + v[k + 1] + v[k - n] + v[k + n] - 4 * v[k]) / h2;\n    for (const k of active)\n      out[k] = (lap[k - 1] + lap[k + 1] + lap[k - n] + lap[k + n] - 4 * lap[k]) / h2\n        + T * (4 * v[k] - v[k - 1] - v[k + 1] - v[k - n] - v[k + n]) / h2 + K[k] * v[k];\n  }\n  const w = new Float64Array(M);\n  if (guess) for (const k of active) w[k] = guess[k];\n  const r = new Float64Array(M), z = new Float64Array(M), d = new Float64Array(M), q = new Float64Array(M);\n  apply(w, q);\n  let rz = 0, bb = 0;\n  for (const k of active) { r[k] = p - q[k]; z[k] = r[k] / diag[k]; d[k] = z[k]; rz += r[k] * z[k]; bb += p * p; }\n  const stop = (tol || 1e-7) ** 2 * bb;\n  let it = 0, rr = Infinity;\n  for (; it < 4000 && rr > stop; it++) {\n    apply(d, q);\n    let dq = 0; for (const k of active) dq += d[k] * q[k];\n    if (dq <= 0) break;\n    const a = rz / dq; let rzNew = 0; rr = 0;\n    for (const k of active) { w[k] += a * d[k]; r[k] -= a * q[k]; z[k] = r[k] / diag[k]; rzNew += r[k] * z[k]; rr += r[k] * r[k]; }\n    const b = rzNew / rz; rz = rzNew;\n    for (const k of active) d[k] = z[k] + b * d[k];\n  }\n  return { w, iterations: it, converged: rr <= stop || bb === 0 };\n}\n\n/* Healthy and affected corneas. The affected shape is prescribed at P_IMAGE; its\n   unloaded offset follows from the same linear model (shape = image - w_image + w_new). */\nfunction buildCornea(prm, h) {\n  const g = makeGrid(h || 0.25), M = g.n * g.n;\n  const c = { g, prm };\n  for (const name of ['G', 'zH', 'zK', 'tH', 'tK', 'sH', 'sK']) c[name] = new Float64Array(M);\n  for (const k of g.ring) {\n    const x = g.x[k], y = g.y[k], G = gauss(x, y, prm.coneX, prm.coneY, prm.coneSigma);\n    c.G[k] = G;\n    c.zH[k] = healthyFront(x, y); c.tH[k] = healthyThick(x, y); c.sH[k] = 1;\n    c.zK[k] = c.zH[k] + prm.bulge * G; c.tK[k] = c.tH[k] - prm.loss * G; c.sK[k] = 1 - prm.weak * G;\n  }\n  c.wH0 = solveShell(g, c.sH, c.tH, prm.E0, P_IMAGE).w;\n  c.wK0 = solveShell(g, c.sK, c.tK, prm.E0, P_IMAGE).w;\n  return c;\n}\n\n/* Depth transport through the stroma (implicit Euler), reservoir at the surface.\n   c = free protein, b = matrix-bound, both relative to the initial reservoir. */\nfunction transport(prm) {\n  const L = 0.5, N = 25, dz = L / N, dt = 0.05;\n  const D = prm.diff * 0.0036;                       // um^2/s -> mm^2/h\n  const P = Math.pow(10, prm.permLog) * 36000;       // cm/s -> mm/h\n  const Peff = 1 / (1 / P + dz / (2 * D));\n  const c = new Float64Array(N), b = new Float64Array(N);\n  const steps = Math.round(prm.observe / dt), times = [0], series = [0];\n  const den = 1 + dt * (prm.koff + prm.kcl), beta = dt * prm.kon / den;\n  const a = D * dt / (dz * dz);\n  const cp = new Float64Array(N), dp = new Float64Array(N);\n  let integral = 0;\n  for (let s = 1; s <= steps; s++) {\n    const t = s * dt, open = t <= prm.contact + 1e-9;\n    const Cr = Math.pow(0.5, t / prm.resHalf), alpha = new did not converge.';\n    $('uncert').disabled = $('csv').disabled = false;\n  }, 30);\n}\n\nconst shown = () => SCEN.filter(s => state.res[s.key]);\nconst fmt = (v, d) => Number.isFinite(v) ? v.toFixed(d) : '–';\nfunction maxHeight(r) {\n  const c = state.cornea, g = c.g; let m = 0;\n  for (const k of g.active) if (Math.hypot(g.x[k], g.y[k]) <= Sim.R_OPT) m = Math.max(m, (r.front[k] - c.zH[k]) * 1000);\n  return m;\n}\nfunction rows() {\n  return shown().map(s => {\n    const r = state.res[s.key], o = r.optics;\n    return { s, rms: o.rms, mtf: o.mtfArea, spot: o.spot, bulge: maxHeight(r),\n      peak: r.dS ? Math.max(...r.dS) : 0, on: r.info && r.info.onTarget, used: r.info && r.info.delivered };\n  });\n}\n\nfunction render() {\n  const delivery = state.p.mode === 'delivery', data = rows();\n  $('results').innerHTML = `<tr><th>Scenario<\/th><th>Higher-order RMS error (µm)<\/th><th>MTF area, 0–30 c/deg (% of limit)<\/th><th>Spot radius (arcmin)<\/th><th>Max outward difference (µm)<\/th><th>Peak added factor<\/th>${delivery ? '<th>Exposure on target (%)<\/th>' : '<th>Budget delivered (%)<\/th>'}<\/tr>` +\n    data.map(d => `<tr><td><span class=\"key\" style=\"background:${d.s.color}\"><\/span>${d.s.name}<\/td><td>${fmt(d.rms, 2)}<\/td><td>${fmt(d.mtf, 1)}<\/td><td>${fmt(d.spot, 1)}<\/td><td>${fmt(d.bulge, 0)}<\/td><td>${d.s.key === 'healthy' || d.s.key === 'none' ? '–' : fmt(d.peak, 2)}<\/td><td>${d.on !== undefined ? fmt(100 * d.on, 0) : d.used !== undefined ? fmt(100 * d.used, 0) : '–'}<\/td><\/tr>`).join('');\n  const b = state.res.opt && state.best.foot;\n  $('optNote').textContent = (delivery ? 'Mode B: every pattern applies the same total protein. ' : 'Mode A: every pattern has the same thickness-weighted added stiffness, unless the local maximum limits it. ') +\n    (b ? `Optimised footprint (lowest RMS error): x ${fmt(b.x, 2)} mm, y ${fmt(b.y, 2)} mm, σ ${fmt(b.sigma, 2)} mm.` : 'Optimising…') +\n    ' The healthy reference is error-free by definition at 15 mmHg.' +\n    (!delivery && state.p.budget > 0 && data.some(d => d.used !== undefined && d.used < 0.995) ? ' Warning: the local maximum stops at least one pattern from using the full budget, so that comparison is not matched. Lower the budget or raise the maximum.' : '');\n  $('uncertTable').innerHTML = '';\n  drawEye(); drawMaps(); drawBlur(); drawCharts();\n}\n\n/* ---------- 3D eye ---------- */\nlet eye = null, eyeScenario = 'none';\nconst VIEWS = { front: [0, 0, 1.7, false], angle: [0.5, 0.12, 1, false], side: [-1.5708, 0, 1.9, false], section: [-1.5708, 0, 1.9, true] };\nfunction setView(name) {\n  const [yaw, pitch, zoom, cut] = VIEWS[name];\n  Object.assign(eye.view, { yaw, pitch, zoom, cut });\n  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', b.dataset.view === name);\n  drawEye();\n}\nfunction initEye() {\n  try { eye = Eye3D.create($('eye')); } catch (e) { console.error(e); }\n  if (!eye) { $('eyeCard').innerHTML = '<h2>3D human eye<\/h2><p class=\"sub\">This browser could not start 3D graphics (WebGL). The rest of the simulator still works.<\/p>'; return; }\n  $('eyeScen').innerHTML = SCEN.map(s => `<button data-scen=\"${s.key}\"><span class=\"key\" style=\"background:${s.color}\"><\/span>${s.name}<\/button>`).join('');\n  $('eyeScen').onclick = e => { const b = e.target.closest('[data-scen]'); if (b) { eyeScenario = b.dataset.scen; drawEye(); } };\n  for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);\n  $('eyeHeat').onchange = e => { eye.view.heat = e.target.checked; drawEye(); };\n  $('eyeRings').onchange = e => { eye.view.rings = e.target.checked; drawEye(); };\n  $('eyeMag').oninput = drawEye;\n  setView('angle');\n}\nfunction drawEye() {\n  if (!eye) return;\n  const magnify = +$('eyeMag').value; $('eyeMagOut').textContent = magnify + '×' + (magnify === 1 ? ' (true shape)' : '');\n  if (!state) return;\n  const { cornea: c, p, res } = state;\n  const key = res[eyeScenario] ? eyeScenario : 'none', s = SCEN.find(q => q.key === key);\n  for (const b of $('eyeScen').children) { b.disabled = !res[b.dataset.scen]; b.setAttribute('aria-pressed', b.dataset.scen === key); }\n  let devMax = 20;\n  for (const k of c.g.active) devMax = Math.max(devMax, Math.abs(res.none.front[k] - c.zH[k]) * 1000);\n  eye.update({ g: c.g, front: res[key].front, thick: key === 'healthy' ? c.tH : c.tK, zH: c.zH, magnify, pupil: p.pupil, cutX: Math.max(-3, Math.min(3, p.coneX)), devMax });\n  $('eyeLabel').textContent = `${s.name}\\nShape difference shown at ${magnify}×`;\n  $('eyeNote').textContent = (eye.view.cut ? 'Cut through the cone centre. Blue lines: front and back of the cornea. Dashed yellow: healthy front surface. ' : '') +\n    (eye.view.heat ? `Red is further out than healthy, blue further in; full colour at ${devMax.toFixed(0)} µm. ` : '') +\n    (eye.view.rings ? 'Rings are a visual aid like a Placido disc, computed from the magnified surface; they are not a topography measurement. ' : '') +\n    'Globe, iris and lens are generic anatomy.';\n}\n\n/* ---------- maps ---------- */\nconst mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));\nconst hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));\nconst dark = () => matchMedia('(prefers-color-scheme: dark)').matches;\nfunction ramp(stops, t) {\n  const z = Math.max(0, Math.min(1, t)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(z));\n  return mix(hex(stops[i]), hex(stops[i + 1]), z - i);\n}\nconst divStops = () => ['#104281', '#3987e5', dark() ? '#383835' : '#f0efec', '#e34948', '#7f1d1d'];\nconst seqStops = () => dark() ? ['#262625', '#184f95', '#3987e5', '#9ec5f4'] : ['#f0efec', '#9ec5f4', '#2a78d6', '#0d366b'];\n\nfunction mapFigure(host, name, value, stops, lo, hi, marks, unit, digits) {\n  const N = 200, fig = document.createElement('figure');\n  fig.innerHTML = `<figcaption>${name}<\/figcaption>`;\n  const cv = document.createElement('canvas'); cv.width = cv.height = N; cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', name);\n  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N), W = 2 * Sim.R_OPT;\n  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {\n    const x = ((i + 0.5) / N - 0.5) * W, y = (0.5 - (j + 0.5) / N) * W;\n    if (Math.hypot(x, y) > Sim.R_OPT) continue;\n    img.data.set([...ramp(stops, (value(x, y) - lo) / (hi - lo)), 255], 4 * (j * N + i));\n  }\n  ctx.putImageData(img, 0, 0);\n  const px = x => (x / W + 0.5) * N, py = y => (0.5 - y / W) * N;\n  ctx.strokeStyle = getComputedStyle(document.body).color; ctx.lineWidth = 1.2;\n  if (marks.cone) { ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.arc(px(marks.cone.x), py(marks.cone.y), marks.cone.r / W * N, 0, 7); ctx.stroke(); ctx.setLineDash([]); }\n  if (marks.cross) { const a = px(marks.cross.x), c = py(marks.cross.y); ctx.beginPath(); ctx.moveTo(a - 6, c); ctx.lineTo(a + 6, c); ctx.moveTo(a, c - 6); ctx.lineTo(a, c + 6); ctx.stroke(); }\n  cv.onmousemove = e => {\n    const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width - 0.5) * W, y = (0.5 - (e.clientY - r.top) / r.height) * W;\n    if (Math.hypot(x, y) > Sim.R_OPT) return hideTip();\n    showTip(e, `${name}<br>x ${x.toFixed(1)}, y ${y.toFixed(1)} mm<br><strong>${value(x, y).toFixed(digits)} ${unit}<\/strong>`);\n  };\n  cv.onmouseleave = hideTip;\n  fig.appendChild(cv); host.appendChild(fig);\n}\nfunction scaleBar(el, stops, lo, hi) { el.innerHTML = `<span>${lo}<\/span><span class=\"bar\" style=\"background:linear-gradient(90deg,${stops.join(',')})\"><\/span><span>${hi}<\/span>`; }\n\nfunction drawMaps() {\n  const { cornea: c, p } = state, g = c.g;\n  const cone = { x: p.coneX, y: p.coneY, r: p.coneSigma * Math.sqrt(2 * Math.LN2) };\n  const diffs = shown().filter(s => s.key !== 'healthy').map(s => {\n    const f = new Float64Array(g.n * g.n);\n    for (const k of g.ring) f[k] = (state.res[s.key].front[k] - c.zH[k]) * 1000;\n    return { s, f };\n  });\n  let peak = 20;\n  for (const d of diffs) for (const k of g.active) if (Math.hypot(g.x[k], g.y[k]) <= Sim.R_OPT) peak = Math.max(peak, Math.abs(d.f[k]));\n  const lim = Math.ceil(peak / 10) * 10;\n  $('heightMaps').innerHTML = '';\n  for (const d of diffs) mapFigure($('heightMaps'), d.s.name, (x, y) => Sim.interp(g, d.f, x, y), divStops(), -lim, lim, { cone }, 'µm', 0);\n  scaleBar($('heightScale'), divStops(), -lim + ' µm', '+' + lim + ' µm');\n  const treated = shown().filter(s => ['uni', 'cone', 'opt'].includes(s.key));\n  let hi = 0.1; for (const s of treated) for (const v of state.res[s.key].dS) hi = Math.max(hi, v);\n  hi = Math.ceil(hi * 10) / 10;\n  $('stiffMaps').innerHTML = '';\n  for (const s of treated) {\n    const r = state.res[s.key];\n    mapFigure($('stiffMaps'), s.name, (x, y) => Sim.interp(g, r.dS, x, y), seqStops(), 0, hi, { cone, cross: r.foot.uniform ? null : r.foot }, '', 2);\n  }\n  scaleBar($('stiffScale'), seqStops(), '0', hi.toFixed(1));\n}\n\n/* ---------- blurred letter ---------- */\nfunction drawBlur() {\n  const N = 160, FIELD = 120, LETTER = 50, perPx = FIELD / N, u = LETTER / 5;\n  const isInk = (x, y) => { const a = x + LETTER / 2, b = y + LETTER / 2; if (a < 0 || b < 0 || a >= LETTER || b >= LETTER) return 0; return a < u || Math.floor(b / u) % 2 === 0 ? 1 : 0; };\n  const src = new Float32Array(N * N);\n  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {\n    let s = 0; for (const di of [0.25, 0.75]) for (const dj of [0.25, 0.75]) s += isInk((i + di - N / 2) * perPx, (j + dj - N / 2) * perPx);\n    src[j * N + i] = s / 4;\n  }\n  $('blur').innerHTML = '';\n  for (const s of shown()) {\n    const o = state.res[s.key].optics, psf = new Map(), step = Math.max(1, Math.floor(o.tx.length / 900));\n    let n = 0;\n    for (let k = 0; k < o.tx.length; k += step, n++) {\n      const dx = Math.round(o.tx[k] * Sim.ARCMIN_PER_MRAD / perPx), dy = Math.round(-o.ty[k] * Sim.ARCMIN_PER_MRAD / perPx), key = dx + ',' + dy;\n      psf.set(key, (psf.get(key) || 0) + 1);\n    }\n    const out = new Float32Array(N * N);\n    for (const [key, count] of psf) {\n      const [dx, dy] = key.split(',').map(Number), w = count / n;\n      for (let j = Math.max(0, dy); j < Math.min(N, N + dy); j++) for (let i = Math.max(0, dx); i < Math.min(N, N + dx); i++) out[j * N + i] += w * src[(j - dy) * N + i - dx];\n    }\n    const fig = document.createElement('figure'); fig.innerHTML = `<figcaption>${s.name}<\/figcaption>`;\n    const cv = document.createElement('canvas'); cv.width = cv.height = N; cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Blurred letter E, ' + s.name);\n    const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);\n    for (let k = 0; k < N * N; k++) { const v = Math.round(255 * (1 - Math.min(1, out[k]))); img.data.set([v, v, v, 255], 4 * k); }\n    ctx.putImageData(img, 0, 0); fig.appendChild(cv); $('blur').appendChild(fig);\n  }\n  $('blurNote').textContent = `Letter E, ${LETTER} arcmin tall (about 20/200), from the same rays as the MTF. Geometric blur only: no scatter, diffraction or neural processing. It is not a measure of visual acuity.`;\n}\n\n/* ---------- charts ---------- */\nconst tip = () => $('tip');\nfunction showTip(e, html) { const t = tip(); t.innerHTML = html; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 6) + 'px'; t.style.top = e.clientY + 14 + 'px'; }\nfunction hideTip() { tip().style.display = 'none'; }\nfunction niceTicks(lo, hi) {\n  const raw = (hi - lo) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);\n  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toPrecision(10)); return out;\n}\nfunction lineChart(el, x, series, xlabel, ylabel) {\n  const W = 480, H = 260, L = 52, Rr = 12, T = 8, B = 38;\n  const all = series.flatMap(s => s.y), x0 = x[0], x1 = x[x.length - 1];\n  let lo = Math.min(0, ...all), hi = Math.max(...all); if (hi - lo < 1e-9) hi = lo + 1; hi += (hi - lo) * 0.05;\n  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - Rr), sy = v => T + (hi - v) / (hi - lo) * (H - T - B);\n  let s = `<svg viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"${ylabel} against ${xlabel}\">`;\n  for (const t of niceTicks(lo, hi)) s += `<line x1=\"${L}\" x2=\"${W - Rr}\" y1=\"${sy(t)}\" y2=\"${sy(t)}\" stroke=\"var(--grid)\"/><text x=\"${L - 6}\" y=\"${sy(t) + 4}\" text-anchor=\"end\">${t}<\/text>`;\n  for (const t of niceTicks(x0, x1)) s += `<text x=\"${sx(t)}\" y=\"${H - B + 16}\" text-anchor=\"middle\">${t}<\/text>`;\n  s += `<line x1=\"${L}\" x2=\"${W - Rr}\" y1=\"${H - B}\" y2=\"${H - B}\" stroke=\"var(--axis)\"/><text x=\"${(L + W) / 2}\" y=\"${H - 6}\" text-anchor=\"middle\">${xlabel}<\/text><text transform=\"translate(12 ${(H - B) / 2}) rotate(-90)\" text-anchor=\"middle\">${ylabel}<\/text>`;\n  for (const q of series) s += `<polyline fill=\"none\" stroke=\"${q.color}\" stroke-width=\"2\" stroke-dasharray=\"${q.dash || ''}\" points=\"${q.y.map((v, i) => sx(x[i]) + ',' + sy(v)).join(' ')}\"/>`;\n  s += `<line class=\"cross\" y1=\"${T}\" y2=\"${H - B}\" stroke=\"var(--axis)\" visibility=\"hidden\"/><\/svg>`;\n  el.innerHTML = (series.length > 1 ? '<div class=\"legend\">' + series.map(q => `<span><svg width=\"22\" height=\"6\" style=\"display:inline;width:22px;vertical-align:middle\"><line x1=\"0\" x2=\"22\" y1=\"3\" y2=\"3\" stroke=\"${q.color}\" stroke-width=\"2\" stroke-dasharray=\"${q.dash || ''}\"/><\/svg> ${q.name}<\/span>`).join('') + '<\/div>' : '') + s;\n  const svg = el.querySelector('svg[viewBox]'), cross = svg.querySelector('.cross');\n  svg.onmousemove = e => {\n    const r = svg.getBoundingClientRect(), v = x0 + ((e.clientX - r.left) / r.width * W - L) / (W - L - Rr) * (x1 - x0);\n    let i = 0; for (let k = 1; k < x.length; k++) if (Math.abs(x[k] - v) < Math.abs(x[i] - v)) i = k;\n    cross.setAttribute('x1', sx(x[i])); cross.setAttribute('x2', sx(x[i])); cross.setAttribute('visibility', 'visible');\n    showTip(e, `${xlabel}: ${+x[i].toFixed(2)}<br>` + series.map(q => `${q.name}: <strong>${+q.y[i].toPrecision(3)}<\/strong>`).join('<br>'));\n  };\n  svg.onmouseleave = () => { hideTip(); cross.setAttribute('visibility', 'hidden'); };\n}\nfunction drawCharts() {\n  const { cornea: c, p, res, tr } = state, h = res.healthy.optics;\n  lineChart($('mtfChart'), h.freq, shown().map(s => ({ name: s.name, color: s.color, dash: s.dash, y: res[s.key].optics.mtf })), 'Spatial frequency (cycles/degree)', 'Contrast transfer');\n  const xs = []; for (let x = -4; x <= 4.001; x += 0.1) xs.push(+x.toFixed(2));\n  const yc = Math.max(-3.9, Math.min(3.9, p.coneY)), xin = xs.filter(x => Math.hypot(x, yc) <= 4);\n  lineChart($('secChart'), xin, shown().filter(s => s.key !== 'healthy').map(s => {\n    const f = res[s.key].front;\n    return { name: s.name, color: s.color, dash: s.dash, y: xin.map(x => (Sim.interp(c.g, f, x, yc) - Sim.interp(c.g, c.zH, x, yc)) * 1000) };\n  }), 'x (mm)', 'Height difference (µm)');\n  lineChart($('timeChart'), tr.times, [{ name: 'Retained protein', color: 'var(--uni)', y: tr.series }], 'Time (h)', 'Relative amount');\n  lineChart($('depthChart'), tr.depth, [{ name: 'Free + bound', color: 'var(--uni)', y: tr.total }, { name: 'Bound', color: 'var(--cone)', dash: '7 3', y: tr.bound }], 'Depth (µm)', 'Relative concentration');\n}\n\n/* ---------- uncertainty and export ---------- */\nfunction rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction runUncertainty() {\n  const mine = job, base = state.p, foot = state.best.foot, rand = rng(20261126), SAMPLES = 60;\n  const keys = ['none', 'uni', 'cone', 'opt'], acc = Object.fromEntries(keys.map(k => [k, { rms: [], gain: [] }]));\n  $('uncert').disabled = true;\n  let i = 0;\n  const range = (lo, hi) => lo + (hi - lo) * rand();\n  (function step() {\n    if (mine !== job) return;\n    const p = Object.assign({}, base);\n    p.E0 *= range(0.6, 1.4); p.weak = Math.min(0.75, p.weak * range(0.7, 1.3));\n    if (p.mode === 'budget') p.budget *= range(0.5, 1.5);\n    else {\n      p.emax *= range(0.25, 1.5); p.u50 *= Math.pow(10, range(-0.3, 0.3)); p.diff *= range(0.5, 1.5);\n      p.permLog += range(-0.5, 0.5); p.kon *= range(0.5, 1.5); p.kcl *= range(0.5, 1.5);\n    }\n    const dx = range(-1, 1) * p.placeErr, dy = range(-1, 1) * p.placeErr;\n    const c = Sim.buildCornea(p), tr = Sim.transport(p);\n    const feet = { none: null, uni: { uniform: true }, cone: { x: p.coneX + dx, y: p.coneY + dy, sigma: p.footSigma }, opt: { x: foot.x + dx, y: foot.y + dy, sigma: foot.sigma } };\n    // placement is sampled explicitly here, so remove the expected-blur term\n    p.placeErr = 0;\n    let untreated = 0;\n    for (const k of keys) {\n      const r = Sim.evaluate(c, feet[k], p, tr, { mtf: false, tol: 1e-6 }).optics.rms;\n      if (k === 'none') untreated = r;\n      acc[k].rms.push(r); acc[k].gain.push(100 * (untreated - r) / (untreated || 1));\n    }\n    $('status').textContent = `Uncertainty sample ${++i} of ${SAMPLES}…`;\n    if (i < SAMPLES) return setTimeout(step, 0);\n    const q = (a, f) => { const s = [...a].sort((x, y) => x - y), z = f * (s.length - 1), l = Math.floor(z); return s[l] + (s[Math.ceil(z)] - s[l]) * (z - l); };\n    const span = a => `${q(a, 0.5).toFixed(1)} (${q(a, 0.05).toFixed(1)} to ${q(a, 0.95).toFixed(1)})`;\n    $('uncertTable').innerHTML = '<tr><th>Median (5th to 95th percentile)<\/th><th>RMS error (µm)<\/th><th>Reduction vs untreated (%)<\/th><th>Samples improved<\/th><\/tr>' +\n      SCEN.filter(s => keys.includes(s.key)).map(s => `<tr><td>${s.name}<\/td><td>${span(acc[s.key].rms)}<\/td><td>${s.key === 'none' ? '–' : span(acc[s.key].gain)}<\/td><td>${s.key === 'none' ? '–' : acc[s.key].gain.filter(v => v > 0).length + ' / ' + SAMPLES}<\/td><\/tr>`).join('');\n    $('status').textContent = 'Uncertainty run complete (assumed ranges, fixed random seed).';\n    $('uncert').disabled = false;\n  })();\n}\nfunction downloadCsv() {\n  const lines = ['Illustrative simulation: assumed parameters; not patient data or evidence of efficacy',\n    'scenario,rms_um,mtf_area_percent,spot_arcmin,max_outward_um,peak_added_factor'];\n  for (const d of rows()) lines.push([d.s.name, d.rms, d.mtf, d.spot, d.bulge, d.peak].join(','));\n  lines.push('', 'parameter,value');\n  for (const [k, v] of Object.entries(state.p)) lines.push(k + ',' + v);\n  const f = state.best.foot; lines.push(`optimised_x,${f.x}`, `optimised_y,${f.y}`, `optimised_sigma,${f.sigma}`);\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([lines.join('\\n')], { type: 'text/csv' }));\n  a.download = 'keratoconus_simulation_results.csv'; a.click(); URL.revokeObjectURL(a.href);\n}\n\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => state && render());\nbuildControls(); syncControls(); initEye(); schedule();\n\n<\/script>\n<\/body>\n<\/html>\n", "delivery": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Corneal Delivery Animation<\/title>\n<style>\n:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--a:#2a78d6;--b:#eb6834;--c:#1baf7a;--warn:#fab219}\n@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--a:#3987e5;--b:#d95926;--c:#199e70}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:16px 20px 0}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 2px}\np.sub{margin:2px 0 10px;color:var(--ink2);font-size:12.5px}\n.warn{border-left:4px solid var(--warn);background:var(--surface);padding:8px 12px;margin-top:10px;font-size:13px}\nmain{padding:14px 20px 30px;max-width:1400px}\n.card{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:14px;margin-bottom:14px;min-width:0}\n.player{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n#clock{font-size:22px;font-weight:600;min-width:120px;font-variant-numeric:tabular-nums}\n#scrub{flex:1 1 220px}\nbutton,select{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:6px;padding:6px 10px;cursor:pointer}\nbutton[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}\n.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px}\n@media (max-width:900px){.cols{grid-template-columns:1fr}}\n.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}\n.eyebox{position:relative;border-radius:8px;overflow:hidden;background:#0e0f12}\n#eye{display:block;width:100%;height:430px;touch-action:none;cursor:grab}\n#eyeLabel{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);border-radius:5px;padding:4px 8px;color:#f0efec;font-size:12.5px;white-space:pre-line;pointer-events:none;text-shadow:0 1px 3px #000}\ncanvas.section{display:block;width:100%;height:auto;border-radius:8px;background:#0e0f12}\n.stats{display:flex;flex-wrap:wrap;gap:4px 20px;margin:6px 0 12px;font-variant-numeric:tabular-nums}\n.stats div{font-size:12px;color:var(--ink2)}.stats strong{display:block;font-size:18px;color:var(--ink)}\n.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px;align-items:center}\n.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}\n.bar{display:inline-block;width:110px;height:10px;border-radius:3px;margin:0 6px;vertical-align:middle}\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}\nlabel{display:block;font-size:12.5px;color:var(--ink2)}label output{float:right;color:var(--ink)}input[type=range]{width:100%}\nsvg{width:100%;height:auto;display:block}svg text{fill:var(--muted);font-size:11px}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Local protein delivery to the cornea<\/h1>\n  <div class=\"warn\"><strong>Illustrative animation.<\/strong> Accelerated playback of an assumed transport model, not live or measured data. Parameters are placeholders. It shows movement of protein only: no tissue repair or shape change is modelled here.<\/div>\n<\/header>\n<main>\n  <div class=\"card player\">\n    <button id=\"play\">Play<\/button><button id=\"restart\">Restart<\/button>\n    <div id=\"clock\" aria-live=\"off\">0.0 h<\/div>\n    <input type=\"range\" id=\"scrub\" min=\"0\" max=\"240\" step=\"1\" value=\"0\" aria-label=\"Time in the simulation\">\n    <label>Speed <select id=\"speed\"><option value=\"0.5\">0.5 h per second<\/option><option value=\"1\" selected>1 h per second<\/option><option value=\"3\">3 h per second<\/option><\/select><\/label>\n    <div id=\"phase\" class=\"sub\"><\/div>\n  <\/div>\n  <div class=\"cols\">\n    <div class=\"card\">\n      <h2>3D eye<\/h2>\n      <p class=\"sub\">Rendered model, not a patient eye. Green: gel reservoir. Grey: microneedle patch, drawn enlarged. Purple: protein in the cornea. Drag to rotate.<\/p>\n      <div class=\"row\" role=\"group\" aria-label=\"Condition on the eye\"><button data-eye=\"intact\">Epithelium intact<\/button><button data-eye=\"removed\">Epithelium removed<\/button><button data-eye=\"needle\">Microneedles<\/button><\/div>\n      <div class=\"eyebox\"><canvas id=\"eye\" role=\"img\" aria-label=\"Eye with delivery reservoir\"><\/canvas><div id=\"eyeLabel\"><\/div><\/div>\n      <div class=\"row\" role=\"group\" aria-label=\"View\" style=\"margin-top:8px\"><button data-view=\"front\">Front<\/button><button data-view=\"angle\">Angled<\/button><button data-view=\"side\">Side<\/button><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Cross-section through the delivery site<\/h2>\n      <p class=\"sub\">Depth is drawn about 5 times larger than width. All panels share one colour scale. Dots indicate amount, not individual molecules.<\/p>\n      <div class=\"legend\"><span>Total protein <span id=\"scaleLo\">0<\/span><span class=\"bar\" id=\"bar\"><\/span><span id=\"scaleHi\"><\/span><\/span><span><span class=\"dot\" style=\"background:#fff;border:1px solid #888\"><\/span>Free<\/span><span><span class=\"dot\" style=\"background:#ff9d4d\"><\/span>Matrix-bound<\/span><\/div>\n      <strong>Epithelium intact<\/strong> <span class=\"sub\">(primary condition)<\/span>\n      <canvas class=\"section\" id=\"sec_intact\" width=\"760\" height=\"260\" role=\"img\" aria-label=\"Cross-section with intact epithelium\"><\/canvas>\n      <div class=\"stats\" id=\"stat_intact\"><\/div>\n      <strong>Epithelium removed<\/strong> <span class=\"sub\">(diagnostic comparison only)<\/span>\n      <canvas class=\"section\" id=\"sec_removed\" width=\"760\" height=\"260\" role=\"img\" aria-label=\"Cross-section with epithelium removed\"><\/canvas>\n      <div class=\"stats\" id=\"stat_removed\"><\/div>\n      <strong>Microneedles<\/strong> <span class=\"sub\">(coated needles; breaches the epithelium)<\/span>\n      <p class=\"sub\" id=\"needleInfo\"><\/p>\n      <canvas class=\"section\" id=\"sec_needle\" width=\"760\" height=\"260\" role=\"img\" aria-label=\"Cross-section with microneedle delivery\"><\/canvas>\n      <div class=\"stats\" id=\"stat_needle\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Average protein in the stroma over time<\/h2>\n    <p class=\"sub\">Free plus bound, as % of the starting reservoir concentration. Gel: depth average under its centre. Needles: scaled by the area they cover within the same footprint. Doses are not matched.<\/p>\n    <div class=\"legend\"><span><span class=\"dot\" style=\"background:var(--a)\"><\/span>Intact (solid)<\/span><span><span class=\"dot\" style=\"background:var(--b)\"><\/span>Removed (dashed)<\/span><span><span class=\"dot\" style=\"background:var(--c)\"><\/span>Microneedles (dotted)<\/span><\/div>\n    <div id=\"chart\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Assumptions<\/h2>\n    <p class=\"sub\">Changing a value recalculates and restarts. The reservoir concentration decays with its half-life and is not reduced by uptake.<\/p>\n    <div class=\"controls\" id=\"controls\"><\/div>\n    <div class=\"row\" style=\"margin-top:10px\"><button id=\"reset\">Reset values<\/button><\/div>\n  <\/div>\n<\/main>\n<script>\n/* Reduced-order keratoconus repair model. Every value is an illustrative assumption.\n   Units: mm, MPa, hours, unless a name says otherwise. No patient or laboratory data. */\n(function (root) {\n'use strict';\n\nconst R = 7.8, R_OPT = 4.0, R_MECH = 5.75, NU = 0.49;\nconst N_CORNEA = 1.376, N_AQUEOUS = 1.336, LAMBDA_MM = 0.55e-3;\nconst MMHG = 0.000133322, P_IMAGE = 15; // pressure (mmHg) at which shapes are prescribed\nconst ARCMIN_PER_MRAD = 3.43775, DEG_PER_MRAD = 0.0572958;\n\nconst DEFAULTS = {\n  // default cone (illustrative values)\n  coneX: 0.6, coneY: -0.7, coneSigma: 0.85, bulge: 0.20, loss: 0.14, weak: 0.45,\n  // mechanics and optics\n  E0: 0.3, iop: 15, pupil: 4, correction: 'spherocyl',\n  // repair\n  mode: 'budget', budget: 0.1, cap: 1.5, footSigma: 0.85,\n  // transport\n  dose: 1, permLog: -6, diff: 20, kon: 0.3, koff: 0.05, kcl: 0.02,\n  contact: 2, resHalf: 4, observe: 24, placeErr: 0.3,\n  emax: 1.0, u50: 0.2\n};\n\nfunction makeGrid(h) {\n  const half = Math.ceil(R_MECH / h) + 2, n = 2 * half + 1;\n  const x = new Float64Array(n * n), y = new Float64Array(n * n);\n  const active = [], ring = [];\n  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {\n    const k = j * n + i; x[k] = (i - half) * h; y[k] = (j - half) * h;\n    const r = Math.hypot(x[k], y[k]);\n    if (r < R_MECH - 1e-9) active.push(k);\n    if (r < R_MECH + 1.01 * h && i > 0 && j > 0 && i < n - 1 && j < n - 1) ring.push(k);\n  }\n  return { h, n, half, x, y, active: Int32Array.from(active), ring: Int32Array.from(ring) };\n}\n\nconst gauss = (x, y, cx, cy, s) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * s * s));\nconst healthyFront = (x, y) => Math.sqrt(R * R - x * x - y * y) - R;\nconst healthyThick = (x, y) => 0.55 + 0.16 * (x * x + y * y) / 16;\n\n/* Shallow-shell energy: D(lap w)^2 + N|grad w|^2 + k w^2 - 2pw, w = 0 outside R_MECH.\n   Solved by Jacobi-preconditioned conjugate gradients. */\nfunction solveShell(g, S, thick, E0, iop, guess, tol) {\n  const { n, h, active, ring } = g, M = n * n;\n  const p = iop * MMHG, T = p * R / 2, h2 = h * h, h4 = h2 * h2;\n  const D = new Float64Array(M), K = new Float64Array(M), diag = new Float64Array(M);\n  for (const k of ring) {\n    const E = E0 * S[k], t = thick[k];\n    D[k] = E * t * t * t / (12 * (1 - NU * NU));\n    K[k] = 2 * E * t / ((1 - NU) * R * R);\n  }\n  for (const k of active)\n    diag[k] = (16 * D[k] + D[k - 1] + D[k + 1] + D[k - n] + D[k + n]) / h4 + 4 * T / h2 + K[k];\n  const lap = new Float64Array(M);\n  function apply(v, out) {\n    for (const k of ring) lap[k] = D[k] * (v[k - 1] + v[k + 1] + v[k - n] + v[k + n] - 4 * v[k]) / h2;\n    for (const k of active)\n      out[k] = (lap[k - 1] + lap[k + 1] + lap[k - n] + lap[k + n] - 4 * lap[k]) / h2\n        + T * (4 * v[k] - v[k - 1] - v[k + 1] - v[k - n] - v[k + n]) / h2 + K[k] * v[k];\n  }\n  const w = new Float64Array(M);\n  if (guess) for (const k of active) w[k] = guess[k];\n  const r = new Float64Array(M), z = new Float64Array(M), d = new Float64Array(M), q = new Float64Array(M);\n  apply(w, q);\n  let rz = 0, bb = 0;\n  for (const k of active) { r[k] = p - q[k]; z[k] = r[k] / diag[k]; d[k] = z[k]; rz += r[k] * z[k]; bb += p * p; }\n  const stop = (tol || 1e-7) ** 2 * bb;\n  let it = 0, rr = Infinity;\n  for (; it < 4000 && rr > stop; it++) {\n    apply(d, q);\n    let dq = 0; for (const k of active) dq += d[k] * q[k];\n    if (dq <= 0) break;\n    const a = rz / dq; let rzNew = 0; rr = 0;\n    for (const k of active) { w[k] += a * d[k]; r[k] -= a * q[k]; z[k] = r[k] / diag[k]; rzNew += r[k] * z[k]; rr += r[k] * r[k]; }\n    const b = rzNew / rz; rz = rzNew;\n    for (const k of active) d[k] = z[k] + b * d[k];\n  }\n  return { w, iterations: it, converged: rr <= stop || bb === 0 };\n}\n\n/* Healthy and affected corneas. The affected shape is prescribed at P_IMAGE; its\n   unloaded offset follows from the same linear model (shape = image - w_image + w_new). */\nfunction buildCornea(prm, h) {\n  const g = makeGrid(h || 0.25), M = g.n * g.n;\n  const c = { g, prm };\n  for (const name of ['G', 'zH', 'zK', 'tH', 'tK', 'sH', 'sK']) c[name] = new Float64Array(M);\n  for (const k of g.ring) {\n    const x = g.x[k], y = g.y[k], G = gauss(x, y, prm.coneX, prm.coneY, prm.coneSigma);\n    c.G[k] = G;\n    c.zH[k] = healthyFront(x, y); c.tH[k] = healthyThick(x, y); c.sH[k] = 1;\n    c.zK[k] = c.zH[k] + prm.bulge * G; c.tK[k] = c.tH[k] - prm.loss * G; c.sK[k] = 1 - prm.weak * G;\n  }\n  c.wH0 = solveShell(g, c.sH, c.tH, prm.E0, P_IMAGE).w;\n  c.wK0 = solveShell(g, c.sK, c.tK, prm.E0, P_IMAGE).w;\n  return c;\n}\n\n/* Depth transport through the stroma (implicit Euler), reservoir at the surface.\n   c = free protein, b = matrix-bound, both relative to the initial reservoir. */\nfunction transport(prm) {\n  const L = 0.5, N = 25, dz = L / N, dt = 0.05;\n  const D = prm.diff * 0.0036;                       // um^2/s -> mm^2/h\n  const P = Math.pow(10, prm.permLog) * 36000;       // cm/s -> mm/h\n  const Peff = 1 / (1 / P + dz / (2 * D));\n  const c = new Float64Array(N), b = new Float64Array(N);\n  const steps = Math.round(prm.observe / dt), times = [0], series = [0];\n  const den = 1 + dt * (prm.koff + prm.kcl), beta = dt * prm.kon / den;\n  const a = D * dt / (dz * dz);\n  const cp = new Float64Array(N), dp = new Float64Array(N);\n  let integral = 0;\n  for (let s = 1; s <= steps; s++) {\n    const t = s * dt, open = t <= prm.contact + 1e-9;\n    const Cr = Math.pow(0.5, t / prm.resHalf), alpha = new Float64Array(N);\n    for (let i = 0; i < N; i++) {\n      alpha[i] = b[i] / den;\n      const lo = i > 0 ? -a : 0, up = i < N - 1 ? -a : 0;\n      let dg = 1 - lo - up + dt * (prm.kon + prm.kcl) - dt * prm.koff * beta;\n      let rhs = c[i] + dt * prm.koff * alpha[i];\n      if (i === 0 && open) { dg += dt * Peff / dz; rhs += dt * Peff / dz * Cr; }\n      const m = dg - lo * (i > 0 ? cp[i - 1] : 0);\n      cp[i] = up / m; dp[i] = (rhs - lo * (i > 0 ? dp[i - 1] : 0)) / m;\n    }\n    for (let i = N - 1; i >= 0; i--) c[i] = dp[i] - (i < N - 1 ? cp[i] * c[i + 1] : 0);\n    let mean = 0;\n    for (let i = 0; i < N; i++) { b[i] = alpha[i] + beta * c[i]; mean += (c[i] + b[i]) / N; }\n    integral += mean * dt;\n    if (s % 4 === 0 || s === steps) { times.push(t); series.push(mean); }\n  }\n  const depth = [], total = [], bound = [];\n  for (let i = 0; i < N; i++) { depth.push((i + 0.5) * dz * 1000); total.push(c[i] + b[i]); bound.push(b[i]); }\n  return { times, series, depth, total, bound, meanExposure: integral / prm.observe };\n}\n\n/* A footprint is either {uniform:true} or a Gaussian {x,y,sigma}. */\nconst diskEdge = r => 0.5 * (1 - Math.tanh((r - R_OPT) / 0.15));\n\nfunction stiffnessChange(cornea, foot, prm, tr) {\n  const g = cornea.g, dS = new Float64Array(g.n * g.n), shape = new Float64Array(g.n * g.n);\n  const dA = g.h * g.h;\n  if (prm.mode === 'budget') {\n    // matched integrated material change: integral(dS * t) equals the uniform value\n    let num = 0, den = 0;\n    for (const k of g.ring) {\n      const x = g.x[k], y = g.y[k], disk = diskEdge(Math.hypot(x, y));\n      shape[k] = foot.uniform ? disk : disk * gauss(x, y, foot.x, foot.y, foot.sigma);\n      num += d
